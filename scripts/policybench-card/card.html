<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:840px;background:#faf9f5;
       font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  .pad{padding:53px 53px 0 53px}
  .rule{width:81px;height:5px;background:#914110}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:46px;line-height:1.0;
     color:#100f0b;margin:26px 0 0 0;letter-spacing:-0.005em}
  .sub{font-size:19px;color:#57534e;margin-top:20px;line-height:1.62}
  table{width:1094px;border-collapse:collapse;margin-top:38px}
  td{padding:0;height:52.3px;vertical-align:middle;border-bottom:1px solid #e7e6e4}
  tr:last-child td{border-bottom:none}
  .rank{width:28px;font-size:15px;color:#a8a29e;text-align:left}
  .name{width:339px;font-size:19px;color:#1c1917;white-space:nowrap}
  .track{width:638px;padding-left:0}
  .bar{height:14px;background:#a8490b;border-radius:7px}
  .score{width:76px;font-size:19px;font-weight:700;color:#1c1917;text-align:right}
  .foot{position:absolute;top:800px;left:53px;font-size:15px;color:#78716c}
</style></head><body>
<div class="pad">
  <div class="rule"></div>
  <h1>__TITLE__</h1>
  <div class="sub">__SUB1__<br>__SUB2__</div>
  <table>__ROWS__</table>
</div>
<div class="foot">__FOOT__</div>
</body></html>
